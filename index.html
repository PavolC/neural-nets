<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grokking Nets</title>
    <meta
      name="description"
      content="An interactive course on neural networks from first principles: read a little, play with live visualizations, and implement feedforward, gradient descent and backpropagation in Python in your browser."
    />
    <meta name="theme-color" content="#0b6e4f" />
    <!-- Inline so the tab has an icon without costing a request: the sigmoid
         curve the whole course is built on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fdfdfb'/%3E%3Cpath d='M3 25C10 25 11 7 18 7c5 0 6 0 11 0' fill='none' stroke='%230b6e4f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grokking Nets" />
    <meta
      property="og:description"
      content="Build a neural network from first principles in your browser. No installs, no accounts."
    />
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as React mounts. Without it the whole bundle
           downloads against a blank white page. -->
      <div
        style="
          max-width: 920px;
          margin: 0 auto;
          padding: 2.5rem 1.25rem;
          font-family: Georgia, 'Times New Roman', serif;
          color: #1a1a1a;
        "
      >
        <h1 style="font-size: 2rem; margin: 0 0 0.25rem">Grokking Nets</h1>
        <p style="color: #5a5a5a">Loading the course...</p>
      </div>
    </div>
    <noscript>
      <p style="max-width: 40em; margin: 2rem auto; font-family: Georgia, serif">
        Grokking Nets runs its visualizations and its Python entirely in the browser, so
        it needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
