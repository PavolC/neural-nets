# Publish the static build to GitHub Pages.
#
# Every push to main republishes. configure-pages runs with enablement: true,
# so the first run turns Pages on by itself rather than failing against a
# repository where nobody has visited Settings > Pages yet. That was the first
# run's failure: the build was green and "Get Pages site failed ... Not Found"
# stopped it one step later. Setting Settings > Pages > Source to
# "GitHub Actions" by hand does the same job; enablement: true just means
# nobody has to.
#
# vite.config.ts sets base to "./", so the build works from a project subpath
# (user.github.io/repo/) with no configuration here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing behind
# a build whose output is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions for the Node 24 runtime: the v4 pair still works,
      # but every run warns that the Node 20 they target is being removed.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
