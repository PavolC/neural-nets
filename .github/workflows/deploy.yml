# Publish the static build to GitHub Pages.
#
# Every push to main republishes, once somebody has set Settings > Pages >
# Source to "GitHub Actions". That toggle is a one-time manual step and there
# is no way around it: creating the Pages site takes repository admin rights,
# and GITHUB_TOKEN does not have them at any permission level. Granting
# pages: write below buys the right to deploy to a site that already exists,
# not the right to create one. configure-pages takes an enablement: true input
# that sounds like the fix, and it was tried here: it turns the "Get Pages site
# failed ... Not Found" error into "Create Pages site failed. Error: Resource
# not accessible by integration", one step later and no further along.
#
# vite.config.ts sets base to "./", so the build works from a project subpath
# (user.github.io/repo/) with no configuration here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing behind
# a build whose output is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The checkers, in front of the build rather than beside it. Nothing ran them
  # on the way to Pages before, so every assertion they make was enforced by
  # whoever remembered to type the command. The one that matters most is the
  # mutation check in check_exercises.py: no amount of running the test suites
  # detects a section shadowing an earlier one, because everything stays green.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python3 tools/check_exercises.py
      - run: python3 tools/check_panels.py --fast
      - run: python3 tools/check_brand.py
      - run: python3 tools/brand_palette.py --check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions for the Node 24 runtime: the v4 pair still works,
      # but every run warns that the Node 20 they target is being removed.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reading the counter's address from a repository variable rather than
      # hardcoding it means turning measurement on is a settings change, not a
      # commit. Unset, this is the empty string, startAnalytics() returns
      # immediately and the bundle carries no reference to it: the private
      # build and the measured one differ by one variable and nothing else.
      # Set it at Settings > Secrets and variables > Actions > Variables, as
      # VITE_GOATCOUNTER, to something like
      # https://yourcode.goatcounter.com/count
      - run: npm run build
        env:
          VITE_GOATCOUNTER: ${{ vars.VITE_GOATCOUNTER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
